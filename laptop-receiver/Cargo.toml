[package]
name = "instant-drop-receiver"
version = "1.0.0"
edition = "2021"
authors = ["InstantDrop Systems"]
description = "Ultra-fast local-first Wi-Fi photo transfer receiver daemon"

[dependencies]
tokio = { version = "1.39", features = ["full"] }
dirs = "5.0"
hostname = "0.4"
local-ip-address = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

